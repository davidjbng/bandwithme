name: Release to TestFlight and web

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Published GitHub release tag, matching the app version

concurrency:
  group: production-release
  cancel_in_progress: false

jobs:
  verify:
    name: Verify release metadata
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: node scripts/release-metadata.mjs --release "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

  build_ios:
    name: Build iOS
    needs: [verify]
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  testflight:
    name: Submit this build to TestFlight
    needs: [build_ios]
    type: testflight
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  deploy_web:
    name: Deploy web to Expo Hosting
    needs: [testflight]
    type: deploy
    environment: production
    params:
      prod: true
