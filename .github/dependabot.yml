version: 2

# One monthly version-update PR covers application dependencies and CI actions.
# Security updates remain eligible as soon as GitHub detects a vulnerability.
multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Berlin
    labels: [dependencies]

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
